<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlock CodeVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    /* Login-specific overrides */
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      text-align: center;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .login-logo-icon {
      width: 48px; height: 48px;
      background: var(--gradient-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 6px 20px var(--accent-purple-glow);
    }

    .login-logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-logo-text span { color: var(--accent-purple); }

    .login-icon-ring {
      width: 72px; height: 72px;
      background: var(--gradient-soft);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--accent-purple);
    }

    .login-card h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .login-form { text-align: left; }

    .pw-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .pw-wrapper .input {
      padding-right: 44px;
      font-size: 1rem;
      padding-top: 12px;
      padding-bottom: 12px;
    }

    .pw-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      transition: color var(--transition);
    }

    .pw-eye:hover { color: var(--text-primary); }

    .login-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-hint {
      font-size: 0.75rem;
      text-align: center;
      color: var(--text-muted);
      margin-top: 16px;
    }

    .login-hint strong { color: var(--text-secondary); }

    /* Animated lock glow */
    .login-icon-ring {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.2); }
      50%       { box-shadow: 0 0 0 12px rgba(139,92,246,0); }
    }
  </style>
</head>
<body>
  <!-- Background glow -->
  <div style="position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%, rgba(139,92,246,0.08) 0%, transparent 65%);pointer-events:none;z-index:0;"></div>

  <div class="login-wrap" style="position:relative;z-index:1;">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <span class="login-logo-text">Code<span>Vault</span></span>
      </div>

      <!-- Lock icon -->
      <div class="login-icon-ring">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h1>Site is protected</h1>
      <p>Enter the global password to access CodeVault and all your notes &amp; files.</p>

      <form class="login-form" method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" id="loginForm">

        {% if error %}
        <div class="login-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ error }}
        </div>
        {% endif %}

        <div class="pw-wrapper">
          <input
            type="password"
            name="password"
            id="passwordInput"
            class="input"
            placeholder="Enter site password..."
            autofocus
            autocomplete="current-password"
            required
          />
          <button type="button" class="pw-eye" id="togglePw" title="Show/hide password">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="unlockBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
          </svg>
          Unlock CodeVault
        </button>
      </form>

      <p class="login-hint">
        🔒 This password protects the entire site. <strong>All visitors need it.</strong>
      </p>
    </div>
  </div>

  <script>
    // Show/hide password toggle
    const pwInput = document.getElementById('passwordInput');
    const togglePw = document.getElementById('togglePw');
    const eyeIcon  = document.getElementById('eyeIcon');

    togglePw.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });

    // Loading state on submit
    document.getElementById('loginForm').addEventListener('submit', () => {
      const btn = document.getElementById('unlockBtn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" opacity="0.75"/></svg> Unlocking...`;
    });

    // Persist theme
    (function() {
      const t = localStorage.getItem('cv_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</body>
</html>
